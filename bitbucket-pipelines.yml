image: hashicorp/terraform:1.7.0

pipelines:
  branches:
    main:
      - step:
          name: 'Deploy: Zero-Secret OIDC Terraform Apply'
          oidc: true
          script:
            - export ARM_USE_OIDC=true
            - export ARM_OIDC_TOKEN=$BITBUCKET_STEP_OIDC_TOKEN
            - terraform init
            - terraform apply -auto-approve