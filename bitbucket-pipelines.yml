image: hashicorp/terraform:1.7.0

pipelines:
  # ------------------------------------------------------------------
  # 1. Runs automatically on Pull Requests (Validation & Dry Run)
  # ------------------------------------------------------------------
  pull-requests:
    '**':
      - step:
          name: 'PR Check: Terraform Init & Plan'
          script:
            - terraform init
            - terraform validate
            - terraform plan

  # ------------------------------------------------------------------
  # 2. Runs ONLY when PR is Approved and Merged into 'main'
  # ------------------------------------------------------------------
  branches:
    main:
      - step:
          name: 'Deploy: Terraform Apply to Azure'
          script:
            - terraform init
            - terraform apply -auto-approve